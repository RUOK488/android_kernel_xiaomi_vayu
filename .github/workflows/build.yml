name: Build SukiSU Kernel for POCO X3 Pro (LineageOS)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14 python2 lz4
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Clone LineageOS kernel (branch lineage-20)
      run: |
        git clone https://github.com/LineageOS/android_kernel_xiaomi_vayu -b lineage-20 --depth=1 kernel
        cd kernel
        if [ ! -f arch/arm64/configs/vayu_defconfig ]; then
          echo "ERROR: vayu_defconfig not found"
          exit 1
        fi

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure kernel (disable HID and all tracing)
      run: |
        cd kernel
        make vayu_defconfig
        # Disable HID to avoid hid-trace.h error
        scripts/config --disable CONFIG_HID
        scripts/config --disable CONFIG_HID_SUPPORT
        # Disable all tracing and debug
        scripts/config --disable CONFIG_TRACING
        scripts/config --disable CONFIG_FTRACE
        scripts/config --disable CONFIG_EVENT_TRACING
        scripts/config --disable CONFIG_DEBUG_FS
        scripts/config --disable CONFIG_DEBUG_KERNEL
        scripts/config --disable CONFIG_DEBUG_INFO
        # Enable SukiSU
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        # Accept all defaults
        make olddefconfig

    - name: Build kernel image
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14 \
          Image.gz-dtb

    - name: Locate and copy kernel image
      run: |
        cd kernel
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          cp arch/arm64/boot/Image.gz-dtb ../Image.gz-dtb
        else
          echo "Image.gz-dtb not found. Searching for any kernel image..."
          find arch/arm64/boot -type f -name "Image*" -exec cp {} ../Image.gz-dtb \;
        fi
        test -f ../Image.gz-dtb || (echo "No kernel image found" && exit 1)

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
        retention-days: 7
