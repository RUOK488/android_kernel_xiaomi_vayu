name: Build SukiSU Kernel for POCO X3 Pro (Final)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel Git URL'
        required: true
        default: 'https://github.com/Jebaitedneko/android_kernel_xiaomi_vayu'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        default: 'caf'
      kernel_defconfig:
        description: 'Kernel defconfig name'
        required: true
        default: 'vayu_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git make bc bison flex libssl-dev libelf-dev \
            build-essential lzop cpio device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14

      - name: Clone Kernel Source
        run: |
          git clone --depth 1 ${{ github.event.inputs.kernel_source }} -b ${{ github.event.inputs.kernel_branch }} kernel
          cd kernel
          if [ ! -f arch/arm64/configs/${{ github.event.inputs.kernel_defconfig }} ]; then
            echo "ERROR: Defconfig not found!"
            find arch/arm64/configs -name "*.config"
            exit 1
          fi

      - name: Integrate SukiSU Ultra
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          rm -rf KernelSU/.git

      - name: Configure the Kernel
        run: |
          cd kernel
          make ${{ github.event.inputs.kernel_defconfig }}
          scripts/config --enable CONFIG_KSU_MANUAL_HOOK
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --disable CONFIG_HID_TRACE
          scripts/config --disable CONFIG_HID_DEBUG

      - name: Build the Kernel
        run: |
          cd kernel
          make -j$(nproc) \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14

      - name: Locate Kernel Image
        id: find_image
        run: |
          cd kernel
          IMAGE_PATH=$(find arch/arm64/boot -type f \( -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" -o -name "zImage" -o -name "Image.lz4" \) | head -1)
          if [ -n "$IMAGE_PATH" ]; then
            echo "IMAGE_PATH=$IMAGE_PATH" >> $GITHUB_OUTPUT
            echo "Image found: $IMAGE_PATH"
          else
            echo "ERROR: No kernel image found."
            exit 1
          fi

      - name: Prepare AnyKernel3 Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          cp kernel/${{ steps.find_image.outputs.IMAGE_PATH }} AnyKernel3/Image.gz-dtb
          cd AnyKernel3
          zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Kernel_vayu
          path: AnyKernel3/*.zip
          retention-days: 7
