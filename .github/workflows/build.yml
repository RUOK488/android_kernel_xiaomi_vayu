name: Build SukiSU Kernel for POCO X3 Pro (Auto-Defconfig)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14 python2 lz4
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Clone kernel source (tejas101k/sixteen - has defconfig)
      run: |
        git clone https://github.com/tejas101k/kernel_xiaomi_vayu -b sixteen --depth=1 kernel
        cd kernel

    - name: Find any defconfig
      id: defconfig
      run: |
        cd kernel
        # List all defconfigs for debugging
        echo "Available defconfigs:"
        find arch/arm64/configs -name "*.config" | sort
        # Try to find one that contains 'vayu' or 'defconfig'
        CONFIG=$(find arch/arm64/configs -name "*vayu*.config" | head -1)
        if [ -z "$CONFIG" ]; then
          CONFIG=$(find arch/arm64/configs -name "defconfig" | head -1)
        fi
        if [ -z "$CONFIG" ]; then
          echo "No defconfig found!"
          exit 1
        fi
        CONFIG_NAME=$(basename "$CONFIG" .config)
        echo "Using defconfig: $CONFIG_NAME"
        echo "NAME=$CONFIG_NAME" >> $GITHUB_OUTPUT

    - name: Integrate SukiSU Ultra
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure kernel
      run: |
        cd kernel
        make ${{ steps.defconfig.outputs.NAME }}
        scripts/config --disable CONFIG_HID
        scripts/config --disable CONFIG_TRACING
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        make olddefconfig

    - name: Build kernel
      run: |
        cd kernel
        make -j$(nproc) \
          CC=clang-14 \
          LD=ld.lld-14 \
          AR=llvm-ar-14 \
          NM=llvm-nm-14 \
          OBJCOPY=llvm-objcopy-14 \
          Image.gz-dtb

    - name: Copy kernel image
      run: |
        cd kernel
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          cp arch/arm64/boot/Image.gz-dtb ../Image.gz-dtb
        else
          find arch/arm64/boot -type f -name "Image*" -exec cp {} ../Image.gz-dtb \;
        fi
        test -f ../Image.gz-dtb

    - name: Package
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
        cp Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 "SukiSU_vayu_$(date +%Y%m%d_%H%M%S).zip" . -x ".git*"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU_Kernel_vayu
        path: AnyKernel3/*.zip
