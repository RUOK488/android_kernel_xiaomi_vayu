name: Build Raw Kernel Image

on:
  workflow_dispatch:

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git make bc bison flex libssl-dev libelf-dev \
          build-essential lzop cpio device-tree-compiler python3 \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          clang-14 lld-14 llvm-14 python2 lz4
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Clone kernel
      run: git clone https://github.com/Jebaitedneko/android_kernel_xiaomi_vayu -b caf --depth=1 kernel

    - name: Integrate SukiSU
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
        rm -rf KernelSU/.git

    - name: Configure
      run: |
        cd kernel
        make vayu_defconfig
        scripts/config --disable CONFIG_HID
        scripts/config --disable CONFIG_HID_SUPPORT
        scripts/config --disable CONFIG_TRACING
        scripts/config --disable CONFIG_FTRACE
        scripts/config --disable CONFIG_EVENT_TRACING
        scripts/config --disable CONFIG_PERF_EVENTS
        scripts/config --disable CONFIG_HUGETLB_PAGE
        scripts/config --disable CONFIG_DEBUG_FS
        scripts/config --disable CONFIG_DEBUG_KERNEL
        scripts/config --disable CONFIG_DEBUG_INFO
        scripts/config --enable CONFIG_KSU_MANUAL_HOOK
        make olddefconfig

    - name: Build raw Image
      run: |
        cd kernel
        make -j$(nproc) CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 Image

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-Image
        path: kernel/arch/arm64/boot/Image

    - name: Upload vmlinux (debug)
      uses: actions/upload-artifact@v4
      with:
        name: vmlinux
        path: kernel/vmlinux
